<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E1C27" />
    <title>AQVL: algorithms, written as code, shown in 3D</title>
    <meta name="title" content="AQVL: algorithms, written as code, shown in 3D" />
    <meta property="og:title" content="AQVL: algorithms, written as code, shown in 3D" />
    <meta name="twitter:title" content="AQVL: algorithms, written as code, shown in 3D" />
    <meta name="description" content="AQVL is a small language for data structures and algorithms. Write a .aqvl program and it runs as an animated 3D scene, step by step, in your browser." />
    <script>
      // Theme before first paint: stored choice (or the old docs key), else the OS preference, else dark.
      (function () {
        var t = 'dark';
        try {
          t = localStorage.getItem('aqvl-theme') || localStorage.getItem('aqvl-docs-theme') || '';
          if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        } catch (e) { t = 'dark'; }
        document.documentElement.setAttribute('data-theme', t);
        // World (the studio, the penguins' ice, the pandas' grove, the whales' reef) and the switches that go with it.
        var w = 'studio', snow = 'on', mascots = 'on';
        try {
          var stored = localStorage.getItem('aqvl-stage-world');
          if (stored === 'penguin' || stored === 'panda' || stored === 'ocean' || stored === 'rabbit' || stored === 'studio') w = stored;
          var prefs = JSON.parse(localStorage.getItem('aqvl-settings') || '{}');
          if (prefs.snow === false) snow = 'off';
          if (prefs.mascots === false) mascots = 'off';
        } catch (e) {}
        document.documentElement.setAttribute('data-world', w);
        document.documentElement.setAttribute('data-snow', snow);
        document.documentElement.setAttribute('data-mascots', mascots);
        var meta = { light: { studio: '#F7EFE9', penguin: '#F1F7FC', panda: '#F4F3E4', ocean: '#EEF8FA', rabbit: '#F4F0FF' }, dark: { studio: '#1E1C27', penguin: '#0C1A2B', panda: '#121C17', ocean: '#071E2C', rabbit: '#1A1838' } };
        document.querySelector('meta[name="theme-color"]').setAttribute('content', meta[t][w]);
      })();
    </script>
    <style>
      /* Shown only until the app's first paint replaces #root's contents. */
      html, body { margin: 0; background: #1e1c27; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f7efe9; }
      html[data-world='penguin'], html[data-world='penguin'] body { background: #0c1a2b; }
      html[data-world='penguin'][data-theme='light'], html[data-world='penguin'][data-theme='light'] body { background: #f1f7fc; }
      html[data-world='panda'], html[data-world='panda'] body { background: #121c17; }
      html[data-world='panda'][data-theme='light'], html[data-world='panda'][data-theme='light'] body { background: #f4f3e4; }
      html[data-world='ocean'], html[data-world='ocean'] body { background: #071e2c; }
      html[data-world='ocean'][data-theme='light'], html[data-world='ocean'][data-theme='light'] body { background: #eef8fa; }
      html[data-world='rabbit'], html[data-world='rabbit'] body { background: #1a1838; }
      html[data-world='rabbit'][data-theme='light'], html[data-world='rabbit'][data-theme='light'] body { background: #f4f0ff; }
      html[data-theme='light'] .boot path { stroke: #3a3649; }
      html[data-world='ocean'] .boot path { stroke: #bfeef2; }
      html[data-world='ocean'][data-theme='light'] .boot path { stroke: #154457; }
      html[data-world='panda'] .boot path { stroke: #d8e8cb; }
      html[data-world='panda'][data-theme='light'] .boot path { stroke: #2a3b25; }
      html[data-world='penguin'] .boot path { stroke: #bfdcf2; }
      html[data-world='penguin'][data-theme='light'] .boot path { stroke: #1e3a56; }
      .boot { display: grid; place-items: center; min-height: 100vh; }
      .boot path { stroke-dasharray: 260; stroke-dashoffset: 260; animation: boot-draw 1.4s cubic-bezier(.65,0,.35,1) infinite alternate; }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { .boot path { animation: none; stroke-dashoffset: 0; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading AQVL">
        <svg width="56" height="56" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M 61.284 66.981 A 30 30 0 1 0 42.000 74.000 L 94 74.000" fill="none" stroke="#ebc0a3" stroke-width="11" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
