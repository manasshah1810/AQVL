<html><head><style>
@font-face{font-family:IT;src:url(../public/fonts/inter-tight-latin-600-normal.woff2)}
@font-face{font-family:IT7;src:url(../public/fonts/inter-tight-latin-700-normal.woff2)}
body{margin:0;background:#0b0c10;display:grid;grid-template-columns:repeat(4,300px);width:1200px;font-family:IT;color:#888}
.c{height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px solid #1a1b22}
.l{background:#efeae0}.row{display:flex;gap:14px;align-items:center}
.wm{grid-column:span 2;height:200px}
</style></head><body>
<script>
const W='#F3F1EC', A='#FF5B2E';
// symbol: circle r=40 at 50,50; n bars; right half solid, left part bars with indents
function sym(f,{n=4,gap=6,ind=[0,14,24,10],round=true,split=false,acc=null}={}){
  const R=40, top=10, h=(80-gap*(n-1))/n; let s='';
  const clip=`<clipPath id="cp${n}${gap}${round}"><circle cx="50" cy="50" r="40"/></clipPath>`;
  let bars='';
  for(let i=0;i<n;i++){const y=top+i*(h+gap);
    // bar spans from left edge of circle(+indent) to x=50 (merging into solid half)
    const yc=y+h/2, dy=Math.abs(yc-50), xl=50-Math.sqrt(R*R-Math.min(R*R,dy*dy));
    const x1 = ind[i]===0 ? 0 : xl+ind[i];
    bars+= ind[i]===0? `<rect x="0" y="${y}" width="52" height="${h}"/>` : `<rect x="${x1}" y="${y}" width="${52-x1}" height="${h}" rx="${round?h/2:0}"/>`;
  }
  // gaps should cut the right half too? no: right half solid
  const half=`<path d="M50 10 A40 40 0 0 1 50 90 Z"/>`;
  return `<defs>${clip}</defs><g fill="${f}"><g clip-path="url(#cp${n}${gap}${round})">${bars}</g>${half}</g>${acc?`<rect x="49" y="10" width="2" height="80" fill="${acc}"/>`:''}`;
}
const V=[
 ['4 bars ragged round',{n:4,gap:6,ind:[0,16,6,26],round:true}],
 ['4 bars ragged square',{n:4,gap:6,ind:[0,16,6,26],round:false}],
 ['5 bars code indent',{n:5,gap:5,ind:[0,12,24,12,0],round:false}],
 ['3 bars',{n:3,gap:8,ind:[0,18,0],round:false}],
];
let html='';
for(const [n,o] of V){html+=`<div class="c"><svg width="140" height="140" viewBox="0 0 100 100">${sym(W,o)}</svg><div class="row"><svg width="32" height="32" viewBox="0 0 100 100">${sym(W,o)}</svg><svg width="16" height="16" viewBox="0 0 100 100">${sym(W,o)}</svg><span>${n}</span></div></div>`}
for(const [n,o] of V){html+=`<div class="c l"><svg width="140" height="140" viewBox="0 0 100 100">${sym('#111',o)}</svg><div class="row"><svg width="32" height="32" viewBox="0 0 100 100">${sym('#111',o)}</svg><svg width="32" height="32" viewBox="0 0 100 100">${sym(A,o)}</svg></div></div>`}
document.write(html);
</script></body></html>
