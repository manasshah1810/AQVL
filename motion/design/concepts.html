<html><head><style>
@font-face{font-family:IT;src:url(../public/fonts/inter-tight-latin-600-normal.woff2)}
body{margin:0;background:#0b0c10;display:grid;grid-template-columns:repeat(4,300px);gap:0;width:1200px;font-family:IT;color:#888}
.c{height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;border:1px solid #1a1b22}
.l{background:#efeae0}
.row{display:flex;gap:14px;align-items:center}
</style></head><body>
<script>
const W='#F3F1EC', A='#FF5B2E';
const k=28.284;
const C={
 lens:(f,g)=>`<g fill="${f}"><path transform="translate(-3.2 -3.2)" d="M${50+k} ${50-k} A40 40 0 0 0 ${50-k} ${50+k} Z"/><path transform="translate(3.2 3.2)" d="M${50+k} ${50-k} A40 40 0 0 1 ${50-k} ${50+k} Z"/></g>`,
 shift:(f,g)=>`<g fill="${f}"><path transform="translate(-6 -1)" d="M${50+k} ${50-k} A40 40 0 0 0 ${50-k} ${50+k} Z"/><path transform="translate(6 1)" d="M${50+k} ${50-k} A40 40 0 0 1 ${50-k} ${50+k} Z"/></g>`,
 aperture:(f)=>{let s='';for(let i=0;i<4;i++)s+=`<path transform="rotate(${i*90} 50 50)" d="M10 10 H62 L50 38 H10 Z"/>`;return `<g fill="${f}">${s}</g>`},
 resolve:(f)=>{let s='';const n=6,R=40;for(let i=0;i<n;i++){const y=10+i*(80/n)+80/n/2;const h=80/n*0.62;const dy=y-50;const x2=50+Math.sqrt(Math.max(0,R*R-dy*dy));const x1=[18,30,10,24,14,34][i];s+=`<rect x="${x1}" y="${y-h/2}" width="${x2-x1}" height="${h}" rx="${h/2}"/>`;}return `<g fill="${f}">${s}</g>`},
};
const names=['lens','shift','aperture','resolve'];
let html='';
for(const n of names){html+=`<div class="c"><svg width="150" height="150" viewBox="0 0 100 100">${C[n](W,A)}</svg><div class="row"><svg width="32" height="32" viewBox="0 0 100 100">${C[n](W)}</svg><svg width="16" height="16" viewBox="0 0 100 100">${C[n](W)}</svg><span>${n}</span></div></div>`}
for(const n of names){html+=`<div class="c l"><svg width="150" height="150" viewBox="0 0 100 100">${C[n]('#111')}</svg><div class="row"><svg width="32" height="32" viewBox="0 0 100 100">${C[n]('#111')}</svg><svg width="32" height="32" viewBox="0 0 100 100">${C[n](A)}</svg></div></div>`}
document.write(html);
</script></body></html>
